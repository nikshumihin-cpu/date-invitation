<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хмм 👀</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1 class="question-title">
    Кажется, твой вечер следующей пятницы уже занят 😊
    <br><br>
    Осталось только понять чем именно...
</h1>
        <div class="heart-wrapper">
    <div class="heart-ring"></div>
    <div class="question-heart">❤️</div>
</div>
        <p class="mini-question">
    ✨ Один вариант очень близок к правде...
</p>

        <div class="buttons">
           

            <button class="answer-button wrong">
                🎡 Колесо обозрения
            </button>

            <button class="answer-button correct">
                🍷 Вечер в красивом месте
            </button>

            <button class="answer-button wrong">
                🎨 Лепка из глины
            </button>

        </div>
        <p class="question-subtitle">
    Выбери вариант, который кажется тебе самым вероятным 💭
</p>
        <p id="hint-text"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
